# Builds Vazaê for Windows and Android on every push and pull request, and
# publishes a GitHub Release when a version tag (vX.Y.Z) is pushed.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Version
        run: bash .github/scripts/version.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the Wails CLI
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      - name: Test
        # The solo package links Wails, which needs GTK/WebKit on Linux; on
        # Windows it builds as is, so the tests run here.
        run: |
          go vet ./game/... ./solo/...
          go test -short ./game/... ./solo/...

      - name: Stamp the version
        env:
          VERSION: ${{ steps.version.outputs.numeric }}
        run: |
          sed -i -E "s/(\"(file_version|ProductVersion)\": \")[^\"]*/\1$VERSION/" build/windows/info.json
          sed -i -E "s/(!define INFO_PRODUCTVERSION \")[^\"]*/\1$VERSION/" build/windows/nsis/wails_tools.nsh
          grep -n "$VERSION" build/windows/info.json build/windows/nsis/wails_tools.nsh

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build and package
        run: wails3 task windows:package

      - name: Collect
        env:
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          mkdir -p dist
          cp bin/vazae.exe "dist/vazae-$LABEL-windows-amd64.exe"
          cp bin/vazae-amd64-installer.exe "dist/vazae-$LABEL-windows-amd64-installer.exe"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Version
        run: bash .github/scripts/version.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the Wails CLI
        # On Linux the CLI builds with cgo against GTK 4 and WebKitGTK 6, which
        # the runner doesn't ship.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      - name: Build and package
        env:
          # The runner ships the Android SDK and several NDKs; use the newest.
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          VERSION_NAME: ${{ steps.version.outputs.label }}
          VERSION_CODE: ${{ github.run_number }}
          # Release signing: set these secrets to sign with your own key. Left
          # unset, the build falls back to the debug key (see README).
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          wails3 task android:package

      - name: Collect
        env:
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          mkdir -p dist
          cp bin/vazae.apk "dist/vazae-$LABEL-android-arm64.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            **Windows:** baixe o `installer.exe` para instalar, ou o `.exe` para rodar sem instalar.

            **Android:** baixe o `.apk` e abra no celular. Esta versão é assinada com uma chave de teste: para atualizar, desinstale a versão anterior antes.
